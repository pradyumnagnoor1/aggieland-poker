name: Verify wait-list
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: jokers_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/jokers_test
      DATABASE_SSL: "false"
      DEMO_MODE: "true"
      LOCAL_DEMO_PASSWORD: local-ci-only-not-a-real-account
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
